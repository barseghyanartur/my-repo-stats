name: Deploy Dashboard to GitHub Pages

on:
  schedule:
    - cron: '0 18 * * *'        # daily at 18:00 UTC (after pepy updates at ~17:00)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Fetch latest data
        env:
          PEPY_API_KEY: ${{ secrets.PEPY_API_KEY }}
          GITHUB_USERNAME: ${{ github.actor }}
        run: make update

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_files: '.github/** .agents/** src/** tests/** .env .env.example .gitignore AGENTS.md Makefile pyproject.toml uv.lock README.rst LICENSE plan.md .tokensave/**'
