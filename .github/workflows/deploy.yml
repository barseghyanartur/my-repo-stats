name: Deploy Dashboard to GitHub Pages

on:
  schedule:
    - cron: '0 18 * * *'        # daily at 18:00 UTC (after pepy updates at ~17:00)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Fetch existing data
        run: |
          git fetch origin data || true
          git show origin/data:pypi_downloads_data.json > pypi_downloads_data.json 2>/dev/null || echo "{}" > pypi_downloads_data.json
          git show origin/data:github_stars_data.json > github_stars_data.json 2>/dev/null || echo "{}" > github_stars_data.json

      - name: Fetch latest data
        env:
          PEPY_API_KEY: ${{ secrets.PEPY_API_KEY }}
          GITHUB_USERNAME: ${{ github.actor }}
        run: make update

      - name: Push data to data branch
        run: |
          git clone --branch data --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git data-repo || \
          (git clone --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git data-repo && cd data-repo && git checkout -b data)
          cp pypi_downloads_data.json github_stars_data.json data-repo/
          cd data-repo
          git add pypi_downloads_data.json github_stars_data.json
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin data

      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          cp index.html stars.html pypi_downloads_data.json github_stars_data.json pypi_packages.json github_repos.json _site/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
