[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-stats-dashboard"
version = "0.1.0"
description = "PyPI download statistics dashboard"
requires-python = ">=3.10"
dependencies = [
      "httpx>=0.27.0",
      "tenacity>=8.0.0",
      "python-dotenv>=1.0.0",
]

[project.scripts]
my-stats = "my_stats_dashboard:main"

[project.optional-dependencies]
dev = [
      "pytest>=8.0.0",
      "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
